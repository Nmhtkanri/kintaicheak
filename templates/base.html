<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}オペレーションハブ{% endblock %}</title>
    <!-- 版を付けて、共有側を更新したのにブラウザが古いCSSを使い続けるのを防ぐ -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ build_stamp | default('dev', true) | urlencode }}">
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <h1 class="header-title">オペレーションハブ</h1>
            <span class="header-sub">勤怠・経費・経理・社労士対応をここから</span>
            {% if build_stamp %}
            <span class="header-sub" style="margin-left:auto; opacity:.65; font-size:12px"
                  title="実行中のアプリの版。共有側の更新後は 起動.bat の再起動で新しくなります">
                {{ build_stamp }}
            </span>
            {% endif %}
        </div>
    </header>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
