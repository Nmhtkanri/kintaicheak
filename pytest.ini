[pytest]
# NAS(共有ドライブ)上ではキャッシュ書き込みのアトミック置換が失敗し、
# pytest-cache-files-* という一時フォルダが大量に残るため、キャッシュ機能を無効化する。
# (--lf / --ff が使えなくなるだけで、テスト実行自体には影響なし)
addopts = -p no:cacheprovider
testpaths = tests
# 既に残ってしまった pytest-cache-files-* は読み取り不能な状態でロックされており、
# 収集時に WinError 5/59 で落ちる。収集対象から外す（削除には所有権の変更が要る）。
norecursedirs = pytest-cache-files-* .git __pycache__ outputs uploads build dist
